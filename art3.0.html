<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>铜铜 Atelier</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Titillium+Web:wght@900&family=Montserrat:wght@700&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ── 色卡变量 ── */
:root {
  --ash:        #B7B4AE;
  --charcoal:   #726E68;
  --bark:       #33312F;
  --kite:       #371E1E;
  --angst:      #0A0A0A;

  /* 导航尺寸（电脑端，按 1920 宽设计稿换算成 vw） */
  --logo-w: clamp(64px, 7.1vw, 136px);
  --paw:    clamp(34px, 4vw, 77px);
  --paw-gap: clamp(4px, 0.55vw, 10px);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--angst);
  color: var(--ash);
  font-family: 'Noto Serif SC', serif;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
}

/* SVG 图标统一跟随文字颜色 */
.icon { display: block; width: 100%; height: 100%; fill: currentColor; }

/* ════════════════════════════════
   NAV
════════════════════════════════ */
nav {
  position: fixed;
  top: clamp(14px, 2.1vw, 40px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  width: 93.5vw;
  background: var(--ash);
  border-radius: 999px;
  padding: clamp(8px, 0.9vw, 18px) clamp(18px, 2vw, 40px);
  display: flex;
  align-items: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}
.cat-logo { width: var(--logo-w); flex-shrink: 0; cursor: pointer; color: var(--kite); }
.cat-logo .icon { height: auto; aspect-ratio: 100 / 75.52; }

.paws { display: flex; gap: var(--paw-gap); margin-left: auto; }
.paw-btn {
  --pad: calc(var(--paw) * 0.08);
  height: calc(var(--paw) + var(--pad) * 2);
  width:  calc(var(--paw) + var(--pad) * 2);
  padding: 0 var(--pad);
  border-radius: 999px;
  display: flex; align-items: center;
  cursor: pointer; overflow: hidden;
  transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
}
.paw-icon {
  width: var(--paw); height: var(--paw); flex-shrink: 0;
  transform: rotate(var(--tilt, 0deg)) scale(0.92);
  transition: transform 0.4s;
}
/* 灰 / 红 交替 */
.paw-btn:nth-child(odd)  .paw-icon { color: var(--charcoal); }
.paw-btn:nth-child(even) .paw-icon { color: var(--kite); }
/* 每只猫爪朝向不同，像一串走过的脚印 */
.paw-btn:nth-child(1) { --tilt: 22deg; }
.paw-btn:nth-child(2) { --tilt: -14deg; }
.paw-btn:nth-child(3) { --tilt: 34deg; }
.paw-btn:nth-child(4) { --tilt: -26deg; }
.paw-btn:nth-child(5) { --tilt: 10deg; }
.paw-text {
  margin-left: 0.8em; white-space: nowrap;
  font-size: clamp(0.85rem, 0.95vw, 1.1rem); color: var(--bark);
  opacity: 0; transition: 0.4s;
}
.paw-btn:hover  { width: calc(var(--paw) + 7em); background: rgba(51, 49, 47, 0.15); }
.paw-btn:hover .paw-text { opacity: 1; }
.paw-btn:hover .paw-icon { transform: rotate(calc(var(--tilt, 0deg) - 20deg)) scale(0.92); }
.paw-btn.active { width: calc(var(--paw) + 7em); background: var(--bark); }
.paw-btn.active .paw-text { opacity: 1; color: var(--ash); }
.paw-btn.active .paw-icon { color: var(--ash); }

/* ════════════════════════════════
   HERO 布局（电脑端）
════════════════════════════════ */
#page-home { position: relative; }

.hero-stage {
  position: relative;
  height: 68vw;           /* 到图片B底部再留一点空 */
  padding-top: 13.2vw;
}

.img-a-box {
  position: relative;
  width: 44.3vw;
  aspect-ratio: 1.58;
  background: var(--bark);
  box-shadow: 1.75vw 1.75vw 0 var(--bark);
  margin-bottom: 2.3vw;
  z-index: 10;
}
.img-a-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

.hero-text-layer {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: fit-content;
  margin-left: 7.5vw;
  z-index: 30;
}
.hero-eyebrow {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: clamp(9px, 0.78vw, 15px);
  letter-spacing: 0.5em;
  padding-left: 0.5em;     /* 抵消最后一个字母后的间距，保持居中 */
  color: var(--kite);
  margin-bottom: 0.4vw;
  white-space: nowrap;
}
.hero-title {
  font-family: 'Titillium Web', sans-serif;
  font-weight: 900;
  font-size: 5.4vw;
  line-height: 0.8;
  color: var(--kite);
}

.deco-bar {
  position: absolute;
  left: 0;
  top: 50vw;
  width: 37.3vw;
  height: 4.2vw;
  background: var(--charcoal);
  z-index: 5;
}

.img-b-container {
  position: absolute;
  left: 5.5vw;
  top: 20.7vw;
  width: 83.4vw;
  height: 46vw;
  background: var(--ash);
  display: flex;
  justify-content: flex-end;
  z-index: 1;
}
.img-b-actual {
  width: 48.4vw;
  height: 100%;
  overflow: hidden;
}
.img-b-actual img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: right center;
  filter: grayscale(0.2);
  opacity: 0.4;
  display: block;
}

/* 右侧竖排水印：字符侧躺 */
.watermark-fixed {
  position: absolute;
  right: 7.25vw;
  top: 12.6vw;
  writing-mode: vertical-rl;
  text-orientation: sideways;
  font-size: max(12px, 1.1vw);
  letter-spacing: 7.95vw;
  line-height: 1;
  color: var(--ash);
  opacity: 0.8;
  white-space: nowrap;
  pointer-events: none;
  z-index: 100;
}

/* 右侧红色竖条，一直落到底部横条 */
.bottom-right-deco {
  position: absolute;
  right: 0;
  top: 43.9vw;
  bottom: 0;
  width: 4.5vw;
  background-color: var(--kite);
  z-index: 20;
}
/* 底部红色横条（与竖条相接） */
.kite-band { height: 4.5vw; background: var(--kite); }

/* ════════════════════════════════
   联系方式
════════════════════════════════ */
.contact-section {
  background-color: var(--charcoal);
  padding: 3.5vw 6vw;
}
.contact-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  column-gap: 6vw;
  max-width: 1100px;
  margin: 0 auto;
}
.contact-col { display: flex; flex-direction: column; gap: 1.6em; padding: 0.6em 0; }
.contact-col:first-child { justify-self: end; }
/* 中间双竖线 */
.contact-divider {
  width: 10px;
  border-left: 1px solid var(--ash);
  border-right: 1px solid var(--ash);
  opacity: 0.7;
}
.contact-item {
  font-size: clamp(0.95rem, 1.25vw, 1.4rem);
  font-weight: 300;
  letter-spacing: 0.12em;
  color: var(--ash);
  white-space: nowrap;
}
.contact-item a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; transition: 0.3s; }
.contact-item a:hover { border-bottom-color: var(--ash); }

/* ════════════════════════════════
   通用逻辑
════════════════════════════════ */
.inner-page { display: none; min-height: 100vh; padding: calc(var(--logo-w) + 120px) 60px 80px; animation: fadeUp 0.6s ease both; }
@keyframes fadeUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:none; } }

.ai-grid { display: flex; gap: 12px; height: 500px; margin-top: 30px;}
.ai-card { flex: 1; position: relative; border-radius: 15px; overflow: hidden; transition: flex 0.6s ease; cursor: pointer; }
.ai-card:hover { flex: 3; }
.ai-card-bg { position: absolute; inset: 0; background: var(--ai-bg); }
.ai-info { position: absolute; bottom: 0; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); width: 100%; }
.ai-brand { font-family: 'Bebas Neue'; font-size: 1.5rem; color: #fff; }

.ai-claude   { --ai-bg: linear-gradient(155deg,#5a1a08,#d07050); }
.ai-deepseek { --ai-bg: linear-gradient(155deg,#050e28,#1a60c0); }
.ai-gpt      { --ai-bg: linear-gradient(155deg,#041408,#287840); }
.ai-gemini   { --ai-bg: linear-gradient(155deg,#f09098,#70b8f0); }
.ai-grok     { --ai-bg: linear-gradient(155deg,#050505,#404040); }

/* 鼠标拖尾：小猫爪 */
.trail-paw { position: fixed; pointer-events: none; width: 18px; height: 18px; color: var(--charcoal); z-index: 9999; animation: pawFade 1.2s ease forwards; }
@keyframes pawFade { 0% { opacity: 0.7; transform: translate(-50%,-50%) rotate(var(--r)) scale(1); } 100% { opacity: 0; transform: translate(-50%,-80%) rotate(var(--r)) scale(0.5); } }

footer { padding: 40px 60px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--charcoal); }
footer a { color: var(--ash); text-decoration: none; margin-left: 15px; }

/* ════════════════════════════════
   手机端（按 375 宽设计稿换算成 vw）
════════════════════════════════ */
@media (max-width: 768px) {
  :root {
    --logo-w: 13.6vw;
    --paw: 6.7vw;
    --paw-gap: 1.9vw;
  }
  nav { top: 2.4vw; width: 93vw; padding: 2.4vw 3vw 2.4vw 4vw; }

  /* 手机没有悬停，激活时只换底色不展开 */
  .paw-btn:hover, .paw-btn.active { width: calc(var(--paw) + var(--pad) * 2); }
  .paw-btn:hover { background: none; }
  .paw-btn:hover .paw-icon { transform: rotate(var(--tilt, 0deg)) scale(0.92); }
  .paw-text { display: none; }

  .hero-stage { height: 226.7vw; padding-top: 24.8vw; }

  .img-a-box {
    width: 75vw;
    aspect-ratio: 1.55;
    box-shadow: 3.7vw 3.7vw 0 var(--bark);
    margin-bottom: 4.6vw;
  }
  .hero-text-layer { align-items: flex-start; margin-left: 9.3vw; }
  .hero-eyebrow { font-size: 1.9vw; letter-spacing: 0.5em; padding-left: 0; margin-bottom: 1.6vw; }
  .hero-title { font-size: 17.5vw; }

  .deco-bar { top: 203.7vw; width: 66vw; height: 11vw; }

  .img-b-container { left: 7.3vw; top: 45vw; width: 79vw; height: 177vw; }
  .img-b-actual { width: 100%; }
  .img-b-actual img { object-position: center; }

  .watermark-fixed { right: 4.6vw; top: 57vw; font-size: 3.2vw; letter-spacing: 26.1vw; }

  .bottom-right-deco { top: 197.3vw; width: 9.3vw; }
  .kite-band { height: 9.3vw; }

  .contact-section { padding: 5vw 0 6vw; }
  .contact-grid { column-gap: 5vw; }
  .contact-col { gap: 6.4vw; padding: 1vw 0; }
  .contact-col:first-child { justify-self: start; padding-left: 8vw; }
  .contact-divider { width: 2.4vw; }
  .contact-item { font-size: 3.4vw; letter-spacing: 0.1em; }

  .inner-page { padding: calc(var(--logo-w) + 60px) 20px 60px; }
  .ai-grid { flex-direction: column; height: 600px; }
  footer { padding: 30px 20px; }
}
</style>
</head>

<script>
const zones = ['oc', 'ai', 'self', 'friend', 'mystery'];

function navigate(targetZone) {
  document.getElementById('page-home').style.display = 'none';
  document.getElementById('site-footer').style.display = 'none';
  zones.forEach(z => document.getElementById('page-' + z).style.display = 'none');
  const target = document.getElementById('page-' + targetZone);
  if(target) target.style.display = 'block';
  document.querySelectorAll('.paw-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(targetZone));
  });
  window.scrollTo(0, 0);
}

document.getElementById('catLogo').addEventListener('click', () => {
  zones.forEach(z => document.getElementById('page-' + z).style.display = 'none');
  document.getElementById('page-home').style.display = 'block';
  document.getElementById('site-footer').style.display = 'flex';
  document.querySelectorAll('.paw-btn').forEach(b => b.classList.remove('active'));
  window.scrollTo(0, 0);
});

let lastPaw = 0;
document.addEventListener('mousemove', e => {
  const now = Date.now();
  if (now - lastPaw < 300) return;
  lastPaw = now;
  const paw = document.createElement('div');
  paw.className = 'trail-paw';
  paw.innerHTML = '<svg class="icon"><use href="#i-paw"/></svg>';
  paw.style.left = e.clientX + 'px';
  paw.style.top = e.clientY + 'px';
  paw.style.setProperty('--r', (Math.random() * 40 - 20) + 'deg');
  document.body.appendChild(paw);
  setTimeout(() => paw.remove(), 1200);
});
</script>
